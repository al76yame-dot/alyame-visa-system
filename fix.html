<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إصلاح التطبيق</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f0f2f5;color:#222;padding:40px;text-align:center;line-height:2}
.box{max-width:500px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{color:#1a4d8f;font-size:22px;margin-bottom:14px}
.spin{display:inline-block;width:40px;height:40px;border:4px solid #eee;border-top:4px solid #1a4d8f;border-radius:50%;animation:s 1s linear infinite;margin:14px}
@keyframes s{to{transform:rotate(360deg)}}
.ok{color:#198754;font-weight:700}
.btn{display:inline-block;padding:12px 24px;background:#1a4d8f;color:#fff;text-decoration:none;border-radius:8px;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<div class="box">
<h1>🔧 جاري إصلاح التطبيق...</h1>
<div class="spin"></div>
<div id="status">يتم الآن مسح الكاش القديم وتحديث النظام...</div>
<div id="done" style="display:none">
  <p class="ok">✓ تم الإصلاح بنجاح!</p>
  <a id="goLink" class="btn" href="#">افتح التطبيق الآن</a>
</div>
</div>

<script>
const co=new URLSearchParams(location.search).get('co')||'';
const target=new URLSearchParams(location.search).get('to')||'okboard.html';

async function fix(){
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){await r.unregister()}
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.clear()}catch(e){}
    try{sessionStorage.clear()}catch(e){}
  }catch(e){console.error(e)}

  document.querySelector('.spin').style.display='none';
  document.getElementById('status').style.display='none';
  document.getElementById('done').style.display='block';
  const link=target+(co?'?co='+co:'');
  document.getElementById('goLink').href=link;
  setTimeout(()=>location.href=link,2000);
}
fix();
</script>
</body>
</html>
