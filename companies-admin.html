<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الشركات - اليامي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f0f2f5;color:#222;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.hd h1{font-size:22px;color:#0D1B3E}
.hd a{color:#0D1B3E;text-decoration:none;font-size:13px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.card h2{font-size:16px;color:#0D1B3E;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fg label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:600}
.fg input{width:100%;padding:9px 10px;border:1px solid #cfd4da;border-radius:6px;font-family:'Cairo',sans-serif;font-size:13px}
.fg input:focus{outline:2px solid #1a4d8f33;border-color:#1a4d8f}
.btn{padding:10px 20px;border:0;border-radius:6px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700}
.btn-p{background:#1a4d8f;color:#fff}
.btn-d{background:#dc3545;color:#fff;padding:6px 12px;font-size:11px}
.btn-c{background:#198754;color:#fff;padding:6px 12px;font-size:11px;text-decoration:none;display:inline-block}
.row{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid #e5e0d5;border-radius:8px;margin-bottom:10px;background:#fafafa}
.row img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #ddd}
.row .info{flex:1}
.row .info b{font-size:14px;color:#0D1B3E}
.row .info .meta{font-size:11px;color:#666;margin-top:2px}
.row .acts{display:flex;gap:6px;flex-direction:column}
.msg{padding:12px;border-radius:6px;font-size:13px;margin-bottom:10px;display:none;font-weight:600}
.msg.ok{background:#d4edda;color:#155724;display:block;border:1px solid #28a745}
.msg.err{background:#f8d7da;color:#721c24;display:block;border:1px solid #dc3545}
input[type=color]{padding:0;height:38px;cursor:pointer}
.link-row{background:#e8f4ff;border:1px solid #1a4d8f33;padding:8px;border-radius:6px;font-size:11px;font-family:monospace;direction:ltr;text-align:left;cursor:pointer;margin-top:4px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>إدارة الشركات - e-Visa</h1>
    <a href="index.html">← العودة للنظام</a>
  </div>

  <div class="card">
    <h2>إضافة شركة جديدة</h2>
    <div id="addMsg" class="msg"></div>
    <div class="grid">
      <div class="fg"><label>الاسم العربي *</label><input id="nameAr" placeholder="شركة الأمل للسياحة"></div>
      <div class="fg"><label>الاسم الإنجليزي</label><input id="nameEn" placeholder="Al Amal Tourism"></div>
      <div class="fg"><label>المعرّف (slug) *</label><input id="slug" placeholder="al-amal" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')"></div>
      <div class="fg"><label>جوال التواصل</label><input id="phone" placeholder="+9665..."></div>
      <div class="fg"><label>رقم الدخول للشركة *</label><input id="authPhone" placeholder="+218913257652"></div>
      <div class="fg"><label>كلمة المرور للشركة *</label><input id="authPass" type="text" placeholder="رقم سري بسيط"></div>
      <div class="fg"><label>اللون الأساسي</label><input id="color" type="color" value="#1a4d8f"></div>
      <div class="fg"><label>الشعار (PNG/JPG)</label><input id="logo" type="file" accept="image/*"></div>
    </div>
    <button class="btn btn-p" style="margin-top:14px" id="addBtn">إضافة الشركة</button>
  </div>

  <div class="card">
    <h2>الشركات المسجّلة (<span id="count">0</span>)</h2>
    <div id="loadMsg" class="msg"></div>
    <div id="list">جارٍ التحميل...</div>
  </div>
</div>

<script>
const SB='https://wcknrzuedgkcyygeqmqw.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indja25yenVlZGdrY3l5Z2VxbXF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MzkwNzAsImV4cCI6MjA5MTMxNTA3MH0.3gU4BYDVjYyl9FoafLGVjcWtv8YFcNRCSTmDtn9ep1Q';
const H={apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'};

function msg(id,type,text){
  const m=document.getElementById(id);
  m.className='msg '+type;
  m.textContent=text;
  m.style.display='block';
  if(type==='ok')setTimeout(()=>{m.style.display='none'},4000);
}

async function loadCompanies(){
  try{
    const r=await fetch(SB+'/rest/v1/companies?select=*&order=created_at.desc',{headers:H});
    if(!r.ok){const t=await r.text();return msg('loadMsg','err','فشل التحميل: '+t)}
    const data=await r.json();
    document.getElementById('count').textContent=data.length;
    if(!data.length){document.getElementById('list').innerHTML='<p style="color:#666;font-size:13px">لا توجد شركات بعد</p>';return}
    const base=location.origin+'/';
    document.getElementById('list').innerHTML=data.map(c=>{
      const evisaLink=base+'evisa.html?co='+c.slug;
      const okbLink=base+'okboard.html?co='+c.slug;
      const logo=c.logo_url||'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 60 60\'><rect width=\'60\' height=\'60\' fill=\'%23eee\'/><text x=\'30\' y=\'35\' font-size=\'9\' text-anchor=\'middle\' fill=\'%23999\'>NO LOGO</text></svg>';
      const creds=(c.auth_phone&&c.passcode)?'<div style="background:#fff8e1;border:1px solid #ffc107;padding:6px 8px;border-radius:6px;margin-top:6px;font-size:11px"><b>بيانات الدخول للشركة:</b> رقم: <code>'+c.auth_phone+'</code> · كلمة المرور: <code>'+c.passcode+'</code></div>':'<div style="color:#dc3545;font-size:11px;margin-top:4px">⚠ بدون بيانات دخول</div>';
      return '<div class="row"><img src="'+logo+'"><div class="info"><b>'+c.name_ar+'</b> '+(c.name_en?'<span style="color:#666">· '+c.name_en+'</span>':'')+'<div class="meta">slug: <code>'+c.slug+'</code> '+(c.contact_phone?'· '+c.contact_phone:'')+'</div>'+creds+'<div style="font-size:10px;color:#1a4d8f;margin-top:6px;font-weight:700">e-Visa:</div><div class="link-row" onclick="copyLink(this,\''+evisaLink+'\')">'+evisaLink+' 📋</div><div style="font-size:10px;color:#1a4d8f;margin-top:6px;font-weight:700">OK to Board:</div><div class="link-row" onclick="copyLink(this,\''+okbLink+'\')">'+okbLink+' 📋</div></div><div class="acts"><a class="btn-c" href="'+evisaLink+'" target="_blank">e-Visa ↗</a><a class="btn-c" href="'+okbLink+'" target="_blank" style="background:#1a4d8f">OK Board ↗</a><button class="btn-d" onclick="delCompany(\''+c.id+'\')">حذف</button></div></div>';
    }).join('');
  }catch(e){msg('loadMsg','err','خطأ شبكة: '+e.message)}
}

function copyLink(el,link){navigator.clipboard.writeText(link);el.style.background='#d4edda';setTimeout(()=>el.style.background='#e8f4ff',800)}

async function addCompany(){
  const nameAr=document.getElementById('nameAr').value.trim();
  const slug=document.getElementById('slug').value.trim();
  const authPhone=document.getElementById('authPhone').value.trim();
  const authPass=document.getElementById('authPass').value.trim();
  if(!nameAr||!slug){msg('addMsg','err','الاسم العربي والمعرّف مطلوبان');return}
  if(!authPhone||!authPass){msg('addMsg','err','رقم الدخول وكلمة المرور للشركة مطلوبان');return}

  const btn=document.getElementById('addBtn');
  btn.disabled=true;btn.textContent='جارٍ الإضافة...';

  try{
    let logoUrl=null;
    const file=document.getElementById('logo').files[0];
    if(file){
      const path=slug+'-'+Date.now()+'-'+file.name.replace(/[^a-z0-9.]/gi,'_');
      const up=await fetch(SB+'/storage/v1/object/company-logos/'+path,{
        method:'POST',
        headers:{apikey:SK,Authorization:'Bearer '+SK},
        body:file
      });
      if(!up.ok){const t=await up.text();msg('addMsg','err','فشل رفع الشعار: '+t);btn.disabled=false;btn.textContent='إضافة الشركة';return}
      logoUrl=SB+'/storage/v1/object/public/company-logos/'+path;
    }

    const payload={
      slug:slug,
      name_ar:nameAr,
      name_en:document.getElementById('nameEn').value.trim()||null,
      logo_url:logoUrl,
      primary_color:document.getElementById('color').value,
      contact_phone:document.getElementById('phone').value.trim()||null,
      auth_phone:authPhone,
      passcode:authPass
    };

    const r=await fetch(SB+'/rest/v1/companies',{method:'POST',headers:H,body:JSON.stringify(payload)});
    if(!r.ok){const t=await r.text();msg('addMsg','err','فشل الإضافة: '+t);btn.disabled=false;btn.textContent='إضافة الشركة';return}

    msg('addMsg','ok','تمت إضافة الشركة بنجاح. أعطِ الشركة: الرابط + رقم الدخول + كلمة المرور');
    ['nameAr','nameEn','slug','phone','authPhone','authPass'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('logo').value='';
    loadCompanies();
  }catch(e){
    msg('addMsg','err','خطأ: '+e.message);
  }
  btn.disabled=false;btn.textContent='إضافة الشركة';
}

async function delCompany(id){
  if(!confirm('حذف الشركة نهائياً؟'))return;
  const r=await fetch(SB+'/rest/v1/companies?id=eq.'+id,{method:'DELETE',headers:H});
  if(!r.ok){const t=await r.text();alert('فشل الحذف: '+t);return}
  loadCompanies();
}

document.getElementById('addBtn').addEventListener('click',addCompany);
loadCompanies();
</script>
</body>
</html>
